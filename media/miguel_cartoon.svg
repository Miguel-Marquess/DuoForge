  <rect x="215" y="152" width="80" height="22" rx="10" fill="#1b1209" transform="rotate(12 255 163)"/>
  <!-- óculos -->
  <circle cx="155" cy="215" r="42" fill="#fff" fill-opacity="0.45" stroke="#222" stroke-width="7"/>
  <circle cx="255" cy="215" r="42" fill="#fff" fill-opacity="0.45" stroke="#222" stroke-width="7"/>
  <path d="M197 212 Q205 202 213 212" fill="none" stroke="#222" stroke-width="7"/>
  <!-- olhos desiguais -->
  <ellipse cx="155" cy="215" rx="17" ry="20" fill="#fff" stroke="#111" stroke-width="3"/>
  <ellipse cx="257" cy="217" rx="13" ry="15" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="160" cy="218" r="8" fill="#111"/>
  <circle cx="253" cy="219" r="6" fill="#111"/>
  <!-- nariz grandão -->
