    <circle cx="105" cy="120" r="38"/>
    <circle cx="150" cy="85" r="42"/>
    <circle cx="205" cy="72" r="44"/>
    <circle cx="258" cy="88" r="40"/>
    <circle cx="300" cy="125" r="36"/>
    <circle cx="82" cy="165" r="22"/>
    <circle cx="322" cy="168" r="22"/>
  </g>
  <path d="M95 150 Q200 110 305 150 Q300 120 200 105 Q100 120 95 150Z" fill="#c68642"/>
