  <circle cx="195" cy="270" r="5" fill="#5a3410"/>
  <circle cx="216" cy="270" r="5" fill="#5a3410"/>
  <!-- barba por fazer -->
  <g fill="#3a2410">
    <circle cx="130" cy="300" r="3"/><circle cx="148" cy="315" r="3"/><circle cx="170" cy="325" r="3"/>
    <circle cx="230" cy="325" r="3"/><circle cx="252" cy="315" r="3"/><circle cx="270" cy="300" r="3"/>
    <circle cx="120" cy="280" r="3"/><circle cx="280" cy="280" r="3"/><circle cx="200" cy="335" r="3"/>
  </g>
  <!-- sorriso com dente faltando -->
  <path d="M135 298 Q205 365 275 295 Q205 320 135 298Z" fill="#fff" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
  <rect x="195" y="313" width="16" height="14" fill="#6b1d1d"/>
  <path d="M135 298 Q205 365 275 295" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
